<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roof Condition Report</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111517;--deep:#181f22;--paper:#fbf9f6;--card:#f1eee8;--rule:#ded7cc;--slate:#727a7e;--mute:#9ba3a6;--sig:#ce4e1b;--sigbg:#faebe2;--grn:#2b6a4e;--grnbg:#e8f0eb;--amb:#b07d14;--text:#111517;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#14181a;--card:#1d2326;--rule:#2d3539;--slate:#98a1a5;--sigbg:#2b1a12;--grnbg:#16261f;--text:#ece8e1;--grn:#6fc29c}}
:root[data-theme="dark"]{--paper:#14181a;--card:#1d2326;--rule:#2d3539;--slate:#98a1a5;--sigbg:#2b1a12;--grnbg:#16261f;--text:#ece8e1;--grn:#6fc29c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--text);font:400 17px/1.6 Lora,Georgia,serif}
h1,h2,h3,.p{font-family:Poppins,system-ui,sans-serif}
.w{max-width:980px;margin:0 auto;padding:0 24px}
.lab{font:500 12px/1 Poppins,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.dark{background:var(--ink);color:#fff}
.cover{padding:44px 0 0}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:20px;padding-bottom:28px;border-bottom:1px solid #2a3135}
.meta b{display:block;font:500 15px Poppins,sans-serif;margin-top:6px;color:#fff;text-transform:none;letter-spacing:0}
.cover h1{font:700 clamp(40px,8vw,72px)/1.05 Poppins,sans-serif;margin:90px 0 6px}
.cover .sub{font:300 clamp(22px,4vw,32px) Poppins,sans-serif;color:#b8bec1;margin:0}
.cover .kick{color:var(--sig);margin-top:90px}
.cover p.tag{color:#c9cdcf;max-width:560px;margin:26px 0 60px}
.cover img{display:block;width:100%;height:340px;object-fit:cover;-webkit-mask-image:linear-gradient(transparent,#000 45%);mask-image:linear-gradient(transparent,#000 45%)}
section{padding:64px 0}
h2{font:700 38px/1.15 Poppins,sans-serif;margin:0 0 28px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:24px;margin-bottom:36px}
.stats b{font:700 60px/1 Poppins,sans-serif;display:block}
.stats span{font:400 15px Poppins,sans-serif;display:block;margin-top:8px}
.stats small{font:400 13px Poppins,sans-serif;color:var(--mute)}
.bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:12px 0 40px;font:400 14px Poppins,sans-serif}
.bar i{display:block;height:12px;background:var(--rule);margin-bottom:8px}
.bar .on i{background:var(--sig)}.bar .on{color:var(--text)}.bar div{color:var(--slate)}
.call{background:var(--sigbg);border-left:5px solid var(--sig);padding:28px 32px}
.call h3{font:600 26px/1.25 Poppins,sans-serif;margin:10px 0}
.call p{margin:0}
.hero .ph{width:100%;max-height:560px;object-fit:cover;display:block}
.hero .in{padding:32px 0 56px}
.chip{display:inline-block;font:600 12px/1 Poppins,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:#fff;padding:6px 10px;border-radius:3px;background:var(--amb)}
.chip.s{background:var(--sig)}.chip.v{background:var(--slate)}
.hero h2{font-size:clamp(30px,5vw,46px);color:#fff;margin:14px 0 20px}
.sol{border-left:4px solid var(--grn);background:var(--grnbg);padding:18px 22px;margin-top:22px}
.sol .lab{color:var(--grn)}
.sol ol{margin:10px 0 0;padding-left:22px;font:500 15.5px/1.5 Poppins,sans-serif}
.sol li{margin:5px 0}
.hero .sol{background:#1e2a25;color:#fff;--grn:#7cc9a3}
.prob{color:var(--sig)}
.card{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);background:var(--card);margin-bottom:28px;border-left:0}
.card img{width:100%;height:100%;min-height:420px;object-fit:cover;display:block}
.card .b{padding:28px 30px;border-left:5px solid var(--amb);position:relative}
.card .b.s{border-color:var(--sig)}
.card h3{font:600 24px/1.25 Poppins,sans-serif;margin:12px 0 4px;padding-right:70px}
.num{position:absolute;right:20px;top:6px;font:700 76px/1 Poppins,sans-serif;color:var(--rule)}
.card ul{margin:10px 0 0;padding-left:20px;font-size:16px}
.card .lab{display:block;margin-top:16px;color:var(--sig)}
.ref{font:400 12px Poppins,sans-serif;color:var(--mute);margin-top:12px;display:block}
@media(max-width:720px){.card{grid-template-columns:1fr}.card img{min-height:0;height:300px}}
table{width:100%;border-collapse:collapse;font:400 15px/1.45 Poppins,sans-serif}
th{background:var(--deep);color:#fff;text-align:left;font-weight:500;padding:10px 12px}
td{padding:12px;border-bottom:1px solid var(--rule);vertical-align:top}
.tw{overflow-x:auto}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.opt{background:var(--card);padding:26px;border-top:5px solid var(--rule);font-family:Poppins,sans-serif}
.opt.rec{border-color:var(--grn);background:var(--grnbg)}
.opt h3{margin:0;font:600 15px Poppins;letter-spacing:.05em}
.opt .old{color:var(--slate);text-decoration:line-through;margin-top:16px;font-size:15px}
.opt .pr{font:700 38px/1.1 Poppins;margin:2px 0 4px}
.opt .d{color:var(--grn);font-size:13px;font-weight:500}
.opt ul{padding-left:18px;font-size:14.5px;margin:16px 0 0}
.opt li{margin:6px 0}
.sig{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:36px 28px;margin-top:20px}
.sig div{border-top:1px solid var(--text);padding-top:8px;font:400 13px Poppins;color:var(--slate);height:64px;display:flex;align-items:flex-end}
.np{background:var(--grnbg);border-left:5px solid var(--grn);padding:22px 26px;margin-top:32px}
footer{padding:30px 0;color:var(--mute);font:400 13px Poppins,sans-serif;border-top:1px solid var(--rule)}

.noimg{background:var(--rule);color:var(--slate);display:flex;align-items:center;justify-content:center;font:500 14px Poppins,sans-serif;min-height:300px;width:100%;height:100%}
.hero .noimg{background:#222b2f;height:340px;min-height:0}
.wide{width:100%;display:block}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.kv div{background:var(--card);padding:14px 16px;font:400 13px Poppins,sans-serif;color:var(--slate)}
.kv b{display:block;font:600 22px Poppins,sans-serif;color:var(--text)}
tr.tot td{font-weight:600}
.rs p{margin:0 0 14px;max-width:820px}
.opt .d{margin-bottom:4px}
</style></head>

<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>(n==null||n==='')?null:Number(n);
const money=n=>(n==null||isNaN(n))?'$ —':'$'+n.toLocaleString('en-US',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2});
const ft=n=>num(n)==null?'—':num(n).toLocaleString('en-US')+' ft';
const sc=s=>/DEFINING|PRIORITY/.test(s)?'s':/VERIFY/.test(s)?'v':'';
const cap=s=>String(s||'').charAt(0)+String(s||'').slice(1).toLowerCase();
const pic=(src,id,alt,cls)=>src?`<img ${cls?`class="${cls}" `:''}src="${esc(src)}" alt="${esc(alt)}">`:`<div class="noimg ${cls||''}">Photo ${esc(id)}</div>`;
const list=a=>Array.isArray(a)?a:(a?[a]:[]);

function prices(d){return (d.options||[]).map(o=>{const L=num(o.listPrice);const p=(L!=null&&d.discount)?Math.round(L*(1-d.discount.pct/100)):L;return{L,p,disc:(L!=null&&p!=null)?L-p:null}})}

function validate(d){const m=[],M=d.meta||{};
['company','homeowner','addressLine1','addressLine2','date','areaSqFt'].forEach(k=>{if(!M[k])m.push('meta.'+k)});
if(!(d.findings||[]).length)m.push('findings');
if((d.options||[]).length!==3)m.push('options (need 3)');
(d.options||[]).forEach((o,i)=>['shingle','mfrWarranty','laborYears','listPrice'].forEach(k=>{if(o[k]==null||o[k]==='')m.push(`options[${i}].${k}`)}));
return m}

function render(d){
 const M=d.meta||{},F=d.findings||[],O=d.options||[],MS=d.measurements,R=d.scopeRefs||{};
 const T=Object.assign({deposit:1000,validityDays:30,timelineDays:7,woodPct:20},d.terms);
 const co=esc(M.company),A=(num(M.areaSqFt)||0).toLocaleString('en-US')+' sq ft',PR=prices(d),D=d.discount,V=d.verdict||{};
 const strip=s=>esc(String(s||'').replace(/ manufacturer warranty$/,''));
 const tiers=['Good','Better','Best'],A1=esc(M.addressLine1),A2=esc(M.addressLine2);
 const photos=F.length+(d.readingSet&&d.readingSet.photoId?1:0);
 const roofBit=M.pitch?`${esc(M.pitch)} pitch`:esc(M.roofDescriptor||'');
 const st=(b,s,sm)=>`<div><b>${b}</b><span>${s}</span><small>${sm}</small></div>`;
 const stats=MS?st(photos,'roof photographs','every problem shown')+st(A.replace(' sq ft',''),'sq ft of roof',esc(M.measureSource||''))+st(esc(M.pitch||'—'),'predominant pitch',`${esc(M.facets||'—')} roof facets`)
   :st(photos,'roof photographs','every problem shown')+st(F.length,'findings','each with its fix')+st(A.replace(' sq ft',''),'sq ft of roof',esc(M.roofNote||''));
 const cond=({serviceable:0,monitor:1,end_of_life:2})[V.condition]??2;
 const bar=['Serviceable','Monitor','End of life'].map((x,i)=>`<div class="${i==cond?'on':''}"><i></i>${x}</div>`).join('');
 const h=F[0]||{};
 const hp=Array.isArray(h.problem)?`<ul style="color:#d5d8da;padding-left:20px">${h.problem.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<p style="color:#d5d8da;max-width:760px">${esc(h.problem)}</p>`;
 const sol=a=>`<div class="sol"><div class="lab" style="margin:0">The solution</div><ol>${list(a).map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`;
 const hero=F.length?`<section class="dark hero" style="padding:0">${pic(h.photoSrc,h.photoId,h.title,'ph')}<div class="w in"><span class="lab">Finding 1 · Photo ${esc(h.photoId)}</span> <span class="chip ${sc(h.severity)}" style="margin-left:10px">${esc(cap(h.severity))}</span><h2>${esc(h.title)}</h2><div class="lab prob">The problem</div>${hp}${sol(h.solution)}</div></section>`:'';
 const cards=F.slice(1).map((f,i)=>{const n=i+2;return`<article class="card">${pic(f.photoSrc,f.photoId,f.title)}<div class="b ${sc(f.severity)}"><span class="num">${String(n).padStart(2,'0')}</span><span class="chip ${sc(f.severity)}">${esc(f.severity)}</span><span class="ref">Finding ${n} · Photo ${esc(f.photoId)}</span><h3>${esc(f.title)}</h3><span class="lab">The problem</span><ul>${list(f.problem).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${sol(f.solution)}</div></article>`}).join('');
 const RS=d.readingSet,rs=RS?`<section><div class="w rs"><h2>Reading the set as a whole</h2>${(RS.groups||[]).map(g=>`<p><b class="p">${esc(g.name)}</b> ${esc(g.text)} ${esc(g.refs)}.</p>`).join('')}${RS.photoId?`<figure style="margin:28px 0 0">${pic(RS.photoSrc,RS.photoId,RS.caption,'wide')}<figcaption class="ref">${esc(RS.photoLabel||'Overview')} · Photo ${esc(RS.photoId)}</figcaption><p style="color:var(--slate);margin:6px 0 0">${esc(RS.caption)}</p></figure>`:''}</div></section>`:'';
 const rows=(d.problemsTable&&d.problemsTable.length?d.problemsTable:F.map(f=>({problem:f.title,solution:list(f.solution)[0],refs:String(F.indexOf(f)+1),severity:f.severity}))).concat([{problem:'How far the deck damage runs',solution:`Inspected at tear-off; damaged wood shown and replaced.`,refs:'At tear-off',severity:'VERIFY'}]);
 const ps=`<table><tr><th>Problem</th><th>Solution</th><th>Findings</th><th>Level</th></tr>${rows.map(r=>`<tr><td>${esc(r.problem)}</td><td>${esc(r.solution)}</td><td>${esc(r.refs)}</td><td>${esc(cap(r.severity))}</td></tr>`).join('')}</table>`;
 const ms=MS?`<section><div class="w"><h2>Your roof, measured</h2><p>Measured by ${esc(M.measureSource)} from aerial imagery, ${esc(M.measureDate)}. Every quantity in the pricing comes from these figures.</p><div class="kv">${[['Roof area',A],['Roof facets',M.facets],['Predominant pitch',M.pitch],['Ridges',ft(MS.ridges)],['Hips',ft(MS.hips)],['Valleys',ft(MS.valleys)],['Rakes',ft(MS.rakes)],['Eaves',ft(MS.eaves)],['Bends',ft(MS.bends)],['Drip edge',ft(MS.drip)],['Step flashing',ft(MS.step)],['Other flashing',ft(MS.flash)]].map(([k,v])=>`<div><b>${esc(v==null?'—':v)}</b>${k}</div>`).join('')}</div></div></section>`:'';
 const caps=MS?(num(MS.hips)||0)+(num(MS.ridges)||0):null;
 const inc=[ 'Tear-off of all existing layers to the deck',`New shingles, ${A}`,`Damaged deck wood replaced as needed, up to ${T.woodPct}%`,'Synthetic underlayment',MS?`New drip edge, ${ft(MS.drip)}`:'New drip edge at every eave and rake',MS?`New valley lining, ${ft(MS.valleys)}`:'New valley lining',MS?`New step flashing, ${ft(MS.step)}`:'New flashing at walls and vents',MS?`New hip and ridge caps, ${ft(caps)}`:'New hip and ridge caps throughout','New flashed boots at every pipe','Manufacturer warranty on materials','Job complete in up to '+T.timelineDays+' days','Clean-up and magnetic nail sweep'];
 const opts=O.map((o,i)=>`<div class="opt ${i==1?'rec':''}"><h3>${tiers[i].toUpperCase()}${i==1?' · RECOMMENDED':''}</h3>${D?`<div class="old">${money(PR[i].L)}</div>`:''}<div class="pr">${money(PR[i].p)}</div>${D?`<div class="d">−${esc(D.pct)}% ${esc(D.name)}</div>`:''}<ul><li>${esc(o.laborYears)}-year warranty</li><li>${esc(o.shingle)} shingles</li><li>${esc(o.laborYears)}-year labor and material warranty</li><li>${esc(o.mfrWarranty)}</li></ul></div>`).join('');
 const r=k=>esc(R[k]||'—'),Y='Included',X='–';
 const line=(a,q,f,c)=>[a,q,f].concat(c||[Y,Y,Y]);
 const sh=i=>[0,1,2].map(j=>j==i?Y:X);
 const it=[line('Tear-off of all existing layers to the deck',A,r('tearoff')),line(`Deck inspection; damaged wood replaced as needed, up to ${T.woodPct}% of the deck`,`As needed, up to ${T.woodPct}%`,r('deck')),line('Synthetic underlayment',A,r('underlayment')),line('New drip edge at all eaves and rakes',MS?ft(MS.drip):'Full perimeter',r('drip')),line('Starter strip at eaves and rakes',MS?ft(MS.drip):'Full perimeter','—'),line('New valley lining',MS?ft(MS.valleys):'Every valley',r('valley'))]
  .concat(MS?[line('New step flashing and counter-flashing at walls',ft(MS.step),r('flashing')),line('Other wall and penetration flashing',ft(MS.flash),r('flashing'))]:[line('New wall and vent flashing','Every junction',r('flashing'))])
