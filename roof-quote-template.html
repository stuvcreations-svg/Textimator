<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>(n==null||n==='')?null:Number(String(n).replace(/,/g,''));
const has=v=>v!=null&&v!=='';
const money=n=>(n==null||isNaN(n))?'$ —':'$'+n.toLocaleString('en-US',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2});
const ft=n=>num(n)==null?'—':num(n).toLocaleString('en-US')+' ft';
const sc=s=>/DEFINING|PRIORITY/.test(s)?'s':/VERIFY/.test(s)?'v':'';
const cap=s=>String(s||'').charAt(0)+String(s||'').slice(1).toLowerCase();
const pic=(src,id,alt,cls)=>src?`<img ${cls?`class="${cls}" `:''}src="${esc(src)}" alt="${esc(alt)}">`:`<div class="noimg ${cls||''}">Photo ${esc(id)}</div>`;
const list=a=>Array.isArray(a)?a:(a?[a]:[]);

function repairTotal(d){const r=d.repair||{};if(num(r.totalPrice)!=null)return num(r.totalPrice);const it=r.items||[];return it.length&&it.every(x=>num(x.price)!=null)?it.reduce((s,x)=>s+num(x.price),0):null}
function prices(d){const src=(d.meta&&d.meta.jobType==='repair')?[{listPrice:repairTotal(d)}]:(d.options||[]);return src.map(o=>{const L=num(o.listPrice);const p=(L!=null&&d.discount)?Math.round(L*(1-d.discount.pct/100)):L;return{L,p,disc:(L!=null&&p!=null)?L-p:null}})}

function validate(d){const m=[],M=d.meta||{};
['company','homeowner','addressLine1','date'].forEach(k=>{if(!M[k])m.push('meta.'+k)});
if(!(d.findings||[]).length)m.push('findings');
if(M.jobType==='repair'){if(!((d.repair||{}).items||[]).length)m.push('repair.items');if(repairTotal(d)==null)m.push('repair.price')}else{if(!(d.options||[]).length)m.push('options');
(d.options||[]).forEach((o,i)=>['listPrice'].forEach(k=>{if(o[k]==null||o[k]==='')m.push(`options[${i}].${k}`)}));}
return m}

function render(d){
 const M=d.meta||{},F=d.findings||[],O=d.options||[],MS=(d.measurements&&Object.values(d.measurements).some(v=>v!=null&&v!==''))?d.measurements:null,R=d.scopeRefs||{};
 const REPAIR=(M.jobType==='repair');
 const T=Object.assign({deposit:1000,depositPct:null,validityDays:30,timelineDays:REPAIR?null:7,woodPct:20,paymentMode:REPAIR?'on_completion':'standard'},d.terms);
 const POC=T.paymentMode==='on_completion',DB=T.paymentMode==='deposit_balance';
 const dep=p=>Math.min(p,T.depositPct!=null?Math.round(p*T.depositPct/100):T.deposit);
 const hasArea=num(M.areaSqFt)>0,co=esc(M.company),A=hasArea?num(M.areaSqFt).toLocaleString('en-US')+' sq ft':'To be confirmed',AN=hasArea?num(M.areaSqFt).toLocaleString('en-US'):'—',AQ=hasArea?A:'Full roof',PR=prices(d),D=d.discount,V=d.verdict||{};
 const strip=s=>esc(String(s||'').replace(/ manufacturer warranty$/,''));
 const tiers=['Good','Better','Best'],A1=esc(M.addressLine1),A2=esc(M.addressLine2);
 const labels=O.map((o,i)=>o.name||tiers[i]),NO=O.length,rec=(NO==3)?1:-1,joinOr=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' or '+a[a.length-1];
 const cols=REPAIR?['Amount']:(NO==1?['Price']:labels);
 const photos=new Set([...F.map(f=>f.photoId),d.readingSet&&d.readingSet.photoId].filter(Boolean).map(String)).size;
 const rh=t=>`<div class="rh"><span>${A1} · ${t}</span><span>${co}</span></div>`;
 const roofBit=M.roofBit?esc(M.roofBit):(M.pitch?`${esc(M.pitch)} pitch`:esc(M.roofDescriptor||''));
 const BR=M.brand||{};
 const ini=String(M.company||'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w.replace(/[^A-Za-z0-9]/g,'').charAt(0)).join('').toUpperCase()||'•';
 const brandrow=`<div class="brandrow">${BR.logo?`<span class="logoplate" style="background:${esc(BR.logoBg||'#ffffff')}${BR.logoBg==='transparent'?';padding:0':''}"><img class="logo" src="${esc(BR.logo)}" alt="${co}"></span>`:`<span class="wm"><i class="mono">${esc(ini)}</i><span>${co}</span></span>`}${(M.reportNo||BR.license)?`<span class="brmeta">${M.reportNo?`<span>Report ${esc(M.reportNo)}</span>`:''}${BR.license?`<span class="lic">Lic. ${esc(BR.license)}</span>`:''}</span>`:''}</div>`;
 const st=(b,s,sm)=>`<div><b>${b}</b><span>${s}</span><small>${sm}</small></div>`;
 const stats=MS?st(photos,'roof photographs','every problem shown')+st(AN,'sq ft of roof',esc(M.areaNote||M.measureSource||''))+st(esc(M.pitch||'—'),'predominant pitch',esc(M.pitchNote||((M.facets||'—')+' roof facets')))
   :st(photos,'roof photographs','every problem shown')+st(F.length,'findings','each with its fix')+st(AN,'sq ft of roof',esc(M.roofNote||''));
 const cond=({serviceable:0,monitor:1,end_of_life:2})[V.condition];
 const bar=['Serviceable','Monitor','End of life'].map((x,i)=>`<div class="${i==cond?'on':''}"><i></i>${x}</div>`).join('');
 const meterBlock=cond==null?'':`<div class="lab">Condition of the shingle field</div><div class="bar">${bar}</div>`;
 const h=F[0]||{};
 const usedG=new Set(d.glance&&d.glance.length?[]:[String(h.photoId)]);
 let gl=(d.glance&&d.glance.length?d.glance.map(n=>F[n-1]):F.slice(1)).filter(f=>f&&(d.glance&&d.glance.length||f!==h));
 gl=gl.filter(f=>{const k=String(f.photoId);if(usedG.has(k))return false;usedG.add(k);return true}).slice(0,3);
 const glance=gl.length?`<div class="lab" style="margin-top:8px">What the photographs show</div><div class="gl">${gl.map(f=>`<figure>${pic(f.photoSrc,f.photoId,f.title)}<figcaption><span class="pl">Photo ${esc(f.photoId)}</span>${esc(f.caption||f.title)}</figcaption></figure>`).join('')}</div>`:'';
 const bl=f=>f.building?esc(f.building).toUpperCase()+' · ':'';
 const hp=Array.isArray(h.problem)?`<ul style="color:#d5d8da;padding-left:20px">${h.problem.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<p style="color:#d5d8da;max-width:760px">${esc(h.problem)}</p>`;
 const sol=a=>`<div class="sol"><div class="lab" style="margin:0">The solution</div><ol>${list(a).map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`;
 const hero=F.length?`<section class="dark hero" style="padding:0">${pic(h.photoSrc,h.photoId,h.title,'ph')}<div class="w in"><span class="lab">${bl(h)}Finding 1 · Photo ${esc(h.photoId)}</span> <span class="chip ${sc(h.severity)}" style="margin-left:10px">${esc(cap(h.severity))}</span><h2>${esc(h.title)}</h2><div class="lab prob">The problem</div>${hp}${sol(h.solution)}</div></section>`:'';
 const cards=F.slice(1).map((f,i)=>{const n=i+2;return`<article class="card">${pic(f.photoSrc,f.photoId,f.title)}<div class="b ${sc(f.severity)}"><span class="num">${String(n).padStart(2,'0')}</span><span class="chip ${sc(f.severity)}">${esc(f.severity)}</span><span class="ref">${bl(f)}Finding ${n} · Photo ${esc(f.photoId)}</span><h3>${esc(f.title)}</h3><span class="lab">The problem</span><ul>${list(f.problem).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${sol(f.solution)}</div></article>`}).join('');
 const RS=(d.readingSet&&F.length>=3&&(d.readingSet.groups||[]).length)?d.readingSet:null,rs=RS?`<section><div class="w rs">${rh('Reading the set as a whole')}<h2>Reading the set as a whole</h2>${(RS.groups||[]).map(g=>`<p><b class="p">${esc(g.name)}</b> ${esc(g.text)} ${esc(g.refs)}.</p>`).join('')}${RS.photoId?`<figure style="margin:28px 0 0">${pic(RS.photoSrc,RS.photoId,RS.caption,'wide')}<figcaption class="ref">${esc(RS.photoLabel||'Overview')} · Photo ${esc(RS.photoId)}</figcaption><p style="color:var(--slate);margin:6px 0 0">${esc(RS.caption)}</p></figure>`:''}</div></section>`:'';
 const rows=(d.problemsTable&&d.problemsTable.length?d.problemsTable:F.map(f=>({problem:f.title,solution:list(f.solution)[0],refs:String(F.indexOf(f)+1),severity:f.severity}))).concat([REPAIR?{problem:'Hidden damage under the repaired areas',solution:'Checked as each repair is opened; anything found is shown to you and priced first.',refs:'When opened',severity:'VERIFY'}:{problem:'How far the deck damage runs',solution:`Inspected at tear-off; damaged wood shown and replaced.`,refs:'At tear-off',severity:'VERIFY'}]);
 const ps=rows.map((r,i)=>`<div class="psr"><div class="n">${String(i+1).padStart(2,'0')}</div><div><b>${esc(r.problem)}</b><p>${esc(r.solution)}</p><small>${/^\d/.test(r.refs)?'Findings '+esc(r.refs):esc(r.refs)}</small></div><div class="chipwrap"><span class="chip ${sc(r.severity)}">${esc(r.severity)}</span></div></div>`).join('');
 const ms=MS?`<section><div class="w"><h2>Your roof, measured</h2><p>Measured by ${esc(M.measureSource)} from aerial imagery, ${esc(M.measureDate)}. Every quantity in the pricing comes from these figures.</p><div class="kv">${[['Roof area',A],['Roof facets',M.facets],['Predominant pitch',M.pitch],['Ridges',ft(MS.ridges)],['Hips',ft(MS.hips)],['Valleys',ft(MS.valleys)],['Rakes',ft(MS.rakes)],['Eaves',ft(MS.eaves)],['Bends',ft(MS.bends)],['Drip edge',ft(MS.drip)],['Step flashing',ft(MS.step)],['Other flashing',ft(MS.flash)]].map(([k,v])=>`<div><b>${esc(v==null?'—':v)}</b>${k}</div>`).join('')}</div></div></section>`:'';
 const caps=MS?(num(MS.hips)||0)+(num(MS.ridges)||0):null;
 const inc=[ 'Tear-off of all existing layers to the deck',`New shingles, ${hasArea?A:'full roof'}`,`Damaged deck wood replaced as needed, up to ${T.woodPct}%`,'Synthetic underlayment',MS?`New drip edge, ${ft(MS.drip)}`:'New drip edge at every eave and rake',MS?`New valley lining, ${ft(MS.valleys)}`:'New valley lining',MS?`New step flashing, ${ft(MS.step)}`:'New flashing at walls and vents',MS?`New hip and ridge caps, ${ft(caps)}`:'New hip and ridge caps throughout','New flashed boots at every pipe','Manufacturer warranty on materials','Job complete in up to '+T.timelineDays+' days','Clean-up and magnetic nail sweep'];
 const opts=O.map((o,i)=>`<div class="opt ${i==rec?'rec':''}">${i==rec?'<span class="tag">RECOMMENDED</span>':''}${NO>1?`<h3>${esc(labels[i]).toUpperCase()}</h3>`:''}${D?`<div class="old">${money(PR[i].L)}</div>`:''}<div class="pr">${money(PR[i].p)}</div>${D?`<div class="d">−${esc(D.pct)}% ${esc(D.name)}</div>`:''}<ul>${has(o.laborYears)?`<li>${esc(o.laborYears)}-year warranty</li>`:''}<li>${esc(o.shingle||'Architectural')} shingles</li>${has(o.laborYears)?`<li>${esc(o.laborYears)}-year labor and material warranty</li>`:''}${has(o.mfrWarranty)?`<li>${esc(o.mfrWarranty)}</li>`:''}<li>The full scope listed below</li></ul></div>`).join('');
 const r=k=>esc(R[k]||'—'),Y='Included',X='–';
 const line=(a,q,f,c)=>[a,q,f].concat(c||O.map(()=>Y));
 const sh=i=>O.map((_,j)=>j==i?Y:X);
 const it=[line('Tear-off of all existing layers to the deck',AQ,r('tearoff')),line(`Deck inspection; damaged wood replaced as needed, up to ${T.woodPct}% of the deck`,`As needed, up to ${T.woodPct}%`,r('deck')),line('Synthetic underlayment',AQ,r('underlayment')),line('New drip edge at all eaves and rakes',MS?ft(MS.drip):'Full perimeter',r('drip')),line('Starter strip at eaves and rakes',MS?ft(MS.drip):'Full perimeter','—'),line('New valley lining',MS?ft(MS.valleys):'Every valley',r('valley'))]
  .concat(MS?[line('New step flashing and counter-flashing at walls',ft(MS.step),r('flashing')),line('Other wall and penetration flashing',ft(MS.flash),r('flashing'))]:[line('New wall and vent flashing','Every junction',r('flashing'))])
  .concat([line('New flashed pipe boots and duct collars (no mastic)','Every penetration',r('boots'))],O.map((o,i)=>line(`${esc(o.shingle||'Architectural')} shingles`,AQ,r('shingles'),sh(i))),
  [line('Matching hip and ridge caps',MS?ft(caps):'All hips and ridges',r('caps')),line('Clean-up, haul-away, magnetic nail sweep','Whole site','—'),line(POC?'Final inspection before payment':'Final inspection before last payment','—','—'),
   line(`Manufacturer warranty on materials`,'—','—',O.map(o=>esc(o.mfrShort||'—'))),line(`${co} warranty, labor and material`,'—','—',O.map(o=>has(o.laborYears)?esc(o.laborYears)+' yrs':'—'))]);
 const itab=`<table><tr><th>#</th><th>Item</th><th>Quantity</th><th>Findings</th>${cols.map(c=>`<th>${c}</th>`).join('')}</tr>${it.map((x,i)=>`<tr><td>${i+1}</td><td>${x[0]}</td>${x.slice(1).map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}${D?`<tr class="tot"><td></td><td>List price</td><td></td><td></td>${PR.map(p=>`<td>${money(p.L)}</td>`).join('')}</tr><tr><td></td><td>${esc(cap(D.name))} discount (${esc(D.pct)}%)</td><td></td><td></td>${PR.map(p=>`<td>${p.disc==null?'$ —':'−'+money(p.disc)}</td>`).join('')}</tr>`:''}<tr class="tot"><td></td><td>${D?'Your price':'Price'}</td><td></td><td></td>${PR.map(p=>`<td>${money(p.p)}</td>`).join('')}</tr></table>`;
 const q=[['Will you remove every existing layer, down to the deck?','Yes. All layers come off and the deck is inspected before anything goes back.'],['What happens if the deck is damaged?',`Replacing up to ${T.woodPct}% of the deck is already in the price. Anything beyond that is shown to you and priced before it is done.`],
  MS?['Was the roof measured, or estimated by eye?',`Measured by ${esc(M.measureSource)}: ${A}, ${esc(M.facets)} facets, ${esc(M.pitch)} pitch.`]:['What roof area is the price based on?',hasArea?`${A}, stated in writing.`:'The roof area is confirmed on site and stated in writing before work starts.'],
  ['Will pipes and ducts be sealed with cement?','No. Every penetration gets new flashing or a collar.'],['Are the drip edge and flashings new, or reused?',MS?`New, in every option: ${ft(MS.drip)} of drip edge, ${ft(MS.step)} of step flashing.`:'New, in every option.'],
  ['Which shingle, and who backs it?',NO?joinOr(O.map((o,i)=>`${esc(o.shingle||'Architectural')}${has(o.mfrWarranty)?`, backed by the ${strip(o.mfrWarranty)} warranty`:''}${NO>1?` (${esc(labels[i])})`:''}`))+'.':'—'],

 $q('#accgo').onclick=async()=>{
  const name=$q('#accname').value.trim();if(name.length<3){err('Please type your full name.');return}
