<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roof Condition Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #111517;
            --deep: #181F22;
            --paper: #FBF9F6;
            --card: #F1EEE8;
            --rule: #DED7CC;
            --slate: #727A7E;
            --mute: #9BA3A6;
            --sig: #CE4E1B;
            --sigbg: #FAEBE2;
            --grn: #2B6A4E;
            --grnbg: #E8F0EB;
            --amb: #B07D14;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Lora', serif;
            background-color: #E5E5E5;
            color: var(--ink);
            margin: 0;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4, h5, .font-sans, th, .btn, .chip {
            font-family: 'Poppins', sans-serif;
        }

        .page {
            max-width: 850px;
            min-height: 1100px;
            margin: 0 auto 40px auto;
            background: var(--paper);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            position: relative;
            page-break-after: always;
            display: flex;
            flex-direction: column;
        }

        /* --- PAGE CONTENT & WRAPPERS --- */
        .page-content { padding: 60px; flex-grow: 1; }
        
        .header {
            display: flex;
            justify-content: space-between;
            text-transform: uppercase;
            font-family: 'Poppins', sans-serif;
            font-size: 10px;
            letter-spacing: 1.5px;
            color: var(--slate);
            border-bottom: 1px solid var(--rule);
            padding-bottom: 15px;
            margin-bottom: 40px;
        }
        
        .footer {
            display: flex;
            justify-content: space-between;
            text-transform: uppercase;
            font-family: 'Poppins', sans-serif;
            font-size: 10px;
            color: var(--slate);
            padding: 30px 60px;
            border-top: 1px solid var(--rule);
        }

        /* --- COVER PAGE --- */
        .cover { background-color: var(--ink); color: white; }
        .cover-top { display: flex; justify-content: space-between; font-family: 'Poppins', sans-serif; font-size: 11px; color: var(--mute); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 100px; }
        .cover-top strong { display: block; color: white; font-size: 13px; margin-top: 5px; font-weight: 500;}
        .cover h1 { font-size: 20px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; margin: 0 0 10px 0; color: white; }
        .cover .address { font-size: 38px; font-weight: 300; font-family: 'Poppins', sans-serif; color: var(--card); margin: 0 0 40px 0; line-height: 1.2; }
        .cover .subtitle { font-size: 16px; color: var(--mute); font-style: italic; }

        /* --- TYPOGRAPHY --- */
        h2.section-title { font-size: 28px; font-weight: 300; color: var(--ink); margin: 0 0 30px 0; }
        .chip { display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; padding: 4px 10px; border-radius: 3px; }
        .chip.defining, .chip.priority { background: var(--sigbg); color: var(--sig); }
        .chip.high, .chip.medium { background: #FDF3E1; color: var(--amb); }
        
        /* --- AT A GLANCE --- */
        .glance-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; margin-bottom: 40px; border-bottom: 1px solid var(--rule); padding-bottom: 40px; }
        .glance-item h3 { font-size: 42px; font-weight: 300; margin: 0; color: var(--sig); }
        .glance-item p { font-family: 'Poppins', sans-serif; font-size: 11px; text-transform: uppercase; color: var(--slate); margin: 5px 0 0 0; letter-spacing: 1px; }
        .verdict-box { margin-bottom: 40px; }
        .verdict-box h4 { font-family: 'Poppins', sans-serif; font-size: 12px; color: var(--slate); text-transform: uppercase; letter-spacing: 1.5px; margin: 0 0 10px 0; }
        .verdict-box p { font-size: 18px; line-height: 1.6; font-weight: 500; color: var(--ink); margin: 0; }

        /* --- FINDING CARDS --- */
        .finding-card { background: var(--card); display: flex; margin-bottom: 30px; border-radius: 4px; overflow: hidden; min-height: 318px; }
        .finding-img { width: 250px; background-color: #ddd; background-size: cover; background-position: center; border-left: 6px solid var(--sig); }
        .finding-content { padding: 30px; flex-grow: 1; }
        .finding-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .finding-header h3 { font-size: 18px; margin: 10px 0 0 0; color: var(--ink); }
        .problem-list { margin: 0 0 20px 0; padding-left: 20px; font-size: 14px; line-height: 1.6; }
        .solution-panel { background: var(--grnbg); padding: 15px 20px; border-left: 4px solid var(--grn); }
        .solution-panel h5 { margin: 0 0 10px 0; font-size: 11px; color: var(--grn); text-transform: uppercase; letter-spacing: 1px; }
        .solution-panel ol { margin: 0; padding-left: 15px; font-size: 14px; font-family: 'Poppins', sans-serif; }

        /* --- TABLES --- */
        table { width: 100%; border-collapse: collapse; margin-bottom: 40px; }
        th { background: var(--deep); color: white; text-align: left; padding: 12px 20px; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 500; }
        td { padding: 15px 20px; border-bottom: 1px solid var(--rule); font-size: 14px; line-height: 1.5; vertical-align: top; }
        tr:nth-child(even) td { background: white; }

        /* --- 3 TIER OPTIONS --- */
        .tier-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .tier-card { background: white; border: 1px solid var(--rule); border-top: 6px solid var(--ink); padding: 30px 20px; display: flex; flex-direction: column; }
        .tier-card.recommended { border-top-color: var(--sig); background: #FFFCF9; position: relative; }
        .tier-card.recommended::before { content: 'RECOMMENDED'; position: absolute; top: -25px; left: 50%; transform: translateX(-50%); background: var(--sig); color: white; font-family: 'Poppins', sans-serif; font-size: 10px; font-weight: 600; padding: 4px 12px; border-radius: 12px; letter-spacing: 1px; }
        .tier-name { font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 600; color: var(--slate); text-transform: uppercase; letter-spacing: 2px; text-align: center; margin: 0 0 15px 0;}
        .tier-price { font-family: 'Poppins', sans-serif; font-size: 36px; font-weight: 300; color: var(--ink); text-align: center; margin: 0 0 5px 0; }
        .tier-warranty { font-family: 'Poppins', sans-serif; font-size: 12px; color: var(--sig); text-align: center; margin: 0 0 20px 0; font-weight: 600; }
        .tier-card ul { padding-left: 20px; font-size: 13px; line-height: 1.6; margin-bottom: 0; color: var(--slate); }
        .tier-card ul li { margin-bottom: 10px; }
        .tier-card ul li strong { color: var(--ink); }

        @media print {
            body { background: none; padding: 0; }
            .page { box-shadow: none; margin: 0; }
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- JS WILL RENDER CONTENT HERE -->
        <p style="text-align:center; padding: 100px; font-family:'Poppins',sans-serif;">Generating Proposal...</p>
    </div>

    <!-- THIS IS WHERE YOUR NODE SERVER INJECTS THE JSON DATA -->
    <script id="report-data" type="application/json">
        {}
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const dataElement = document.getElementById('report-data');
            let data = {};
            
            try {
                data = JSON.parse(dataElement.textContent.trim());
            } catch (e) {
                console.error("JSON Parsing Error", e);
            }

            // Fallback default data to prevent blank screens if fields are missing from the AI
            const meta = data.meta || { 
                homeowner: "Client Details Pending", addressLine1: "Address Pending", addressLine2: "", 
                date: new Date().toLocaleDateString(), areaSqFt: "TBD", pitch: "TBD", 
                company: "Textimator", rep: "Estimator", verdict: "Full roof replacement required."
            };
            const findings = data.findings || [];
            
            // Standardize options array for Good/Better/Best
            let opts = data.options || [];
            if (opts.length < 3) {
                opts = [
                    { name: "GOOD", listPrice: "TBD", shingle: "Architectural", laborYears: "10", mfrWarranty: "Limited" },
                    { name: "BETTER", listPrice: "TBD", shingle: "Premium", laborYears: "15", mfrWarranty: "50-Year" },
                    { name: "BEST", listPrice: "TBD", shingle: "Luxury", laborYears: "25", mfrWarranty: "Lifetime" }
                ];
            }

            // Render Functions
            const renderHeader = (title) => `
                <div class="header">
                    <div>${meta.addressLine1} &middot; ${title}</div>
                    <div>${meta.company}</div>
                </div>
            `;
            
            const renderFooter = (pageNum) => `
                <div class="footer">
                    <div>Roof Condition Report &middot; ${meta.addressLine1}</div>
                    <div>${pageNum}</div>
                </div>
            `;

            const renderCover = () => `
                <div class="page cover">
                    <div class="page-content">
                        <div class="cover-top">
                            <div>PREPARED FOR<strong>${meta.homeowner}</strong></div>
                            <div>REPORT DATE<strong>${meta.date}</strong></div>
                            <div>ROOF AREA<strong>${meta.areaSqFt} sq ft &middot; ${meta.pitch} pitch</strong></div>
                            <div>PREPARED BY<strong>${meta.rep}, ${meta.company}</strong></div>
                        </div>
                        <h1>Roof Condition Report &middot; Shingle Roof Replacement</h1>
                        <div class="address">${meta.addressLine1}<br>${meta.addressLine2}</div>
                        <div class="subtitle">Every problem found on the roof, photographed, with the work that fixes it.</div>
                    </div>
                </div>
            `;

            const renderAtAGlance = () => `
                <div class="page">
                    <div class="page-content">
                        ${renderHeader('AT A GLANCE')}
                        <h2 class="section-title">At a glance</h2>
                        <div class="glance-grid">
                            <div class="glance-item">
                                <h3>${findings.length || 0}</h3>
                                <p>Roof Photographs Logged</p>
                            </div>
                            <div class="glance-item">
                                <h3>${meta.areaSqFt}</h3>
                                <p>Sq Ft of Roof</p>
                            </div>
                            <div class="glance-item">
                                <h3>${meta.pitch}</h3>
                                <p>Predominant Pitch</p>
                            </div>
                        </div>
                        <div class="verdict-box">
                            <h4>The One Thing To Know</h4>
                            <p>${meta.verdict}</p>
                        </div>
                    </div>
                    ${renderFooter(2)}
                </div>
            `;

            const renderFindings = () => {
                if(findings.length === 0) return '';
                let html = `<div class="page"><div class="page-content">${renderHeader('FINDINGS')}<h2 class="section-title">Inspection Findings</h2>`;
                
                findings.forEach((f, index) => {
                    // Page break logic for findings (2 per page)
                    if (index > 0 && index % 2 === 0) {
                        html += `</div>${renderFooter('Findings')}</div><div class="page"><div class="page-content">${renderHeader('FINDINGS')}`;
                    }
                    
                    const problemsHtml = (f.problems || []).map(p => `<li>${p}</li>`).join('');
                    const solutionsHtml = (f.solutions || []).map(s => `<li>${s}</li>`).join('');
                    
                    html += `
                        <div class="finding-card">
                            <div class="finding-img" style="background-image: url('${f.photoSrc || ''}');"></div>
                            <div class="finding-content">
                                <div class="finding-header">
                                    <div class="chip ${f.severity ? f.severity.toLowerCase() : 'high'}">${f.severity || 'HIGH'}</div>
                                    <div class="font-sans" style="font-size:12px; color:var(--mute); font-weight:600;">FINDING ${index + 1}</div>
                                </div>
                                <h3>${f.title || 'Observed Condition'}</h3>
                                <div style="margin-top:15px;">
                                    <h5 class="font-sans" style="font-size:11px; color:var(--sig); text-transform:uppercase; margin-bottom:5px;">The Problem</h5>
                                    <ul class="problem-list">${problemsHtml}</ul>
                                </div>
                                <div class="solution-panel">
                                    <h5>The Solution</h5>
                                    <ol>${solutionsHtml}</ol>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                html += `</div>${renderFooter('Findings')}</div>`;
                return html;
            };

            const renderOptions = () => `
                <div class="page">
                    <div class="page-content">
                        ${renderHeader('YOUR THREE OPTIONS')}
                        <h2 class="section-title">Your three options</h2>
                        <p style="margin-bottom:40px; font-size:16px;">Every option has the same scope of work. They differ only in the shingle and the length of our labor and material warranty.</p>
                        
                        <div class="tier-grid">
                            ${opts.map((opt, i) => `
                                <div class="tier-card ${i === 1 ? 'recommended' : ''}">
                                    <div class="tier-name">${opt.name \vert{}\vert{} (i===0?'GOOD':i===1?'BETTER':'BEST')}</div>                                     <div class="tier-price">$${opt.listPrice}</div>
                                    <div class="tier-warranty">${opt.laborYears}-Year Warranty</div>
                                    <ul>
                                        <li><strong>${opt.shingle}</strong> Shingles</li>
                                        <li><strong>${opt.laborYears}-Year</strong> Labor & Material Warranty</li>
                                        <li><strong>${opt.mfrWarranty}</strong> Manufacturer Warranty</li>
                                        <li>Tear-off of all existing layers to the deck</li>
                                        <li>Damaged deck wood replaced as needed (up to 20%)</li>
                                        <li>New synthetic underlayment & drip edge</li>
                                        <li>New flashed boots at every pipe</li>
                                        <li>Clean-up and magnetic nail sweep</li>
                                    </ul>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    ${renderFooter('Options')}
                </div>
            `;

            // Build the final DOM
            const appDiv = document.getElementById('app');
            appDiv.innerHTML = renderCover() + renderAtAGlance() + renderFindings() + renderOptions();
        });
    </script>
</body>
</html>
