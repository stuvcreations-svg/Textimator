<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roof Condition Report & Proposal</title>
    <style>
        @import url('[https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@300;400;500;600;700&display=swap](https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@300;400;500;600;700&display=swap)');
        
        :root {
            --ink: #111517;
            --deep: #181F22;
            --paper: #FBF9F6;
            --card: #F1EEE8;
            --rule: #DED7CC;
            --slate: #727A7E;
            --mute: #9BA3A6;
            --sig: #CE4E1B;
            --sigbg: #FAEBE2;
            --grn: #2B6A4E;
            --grnbg: #E8F0EB;
            --amb: #B07D14;
        }

        body { 
            font-family: 'Lora', serif; 
            background-color: #E5E5E5; 
            color: var(--ink); 
            margin: 0; 
            padding: 40px 20px; 
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4, h5, .label, th, .btn, .badge {
            font-family: 'Poppins', sans-serif;
        }

        .page {
            max-width: 850px;
            margin: 0 auto 40px auto;
            background: var(--paper);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
        }

        /* --- COVER PAGE --- */
        .cover {
            background-color: var(--ink);
            color: white;
            padding: 60px 50px 80px 50px;
        }
        .cover-meta {
            display: flex;
            justify-content: space-between;
            font-family: 'Poppins', sans-serif;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--mute);
            margin-bottom: 60px;
            flex-wrap: wrap;
            gap: 20px;
        }
        .cover-meta strong {
            display: block;
            color: white;
            font-size: 14px;
            margin-top: 5px;
        }
        .cover h1 {
            font-size: 26px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 0 10px 0;
            color: white;
        }
        .cover .address {
            font-size: 32px;
            font-family: 'Poppins', sans-serif;
            font-weight: 300;
            color: var(--card);
            margin: 0 0 30px 0;
            line-height: 1.2;
        }
        .cover .subtitle {
            font-size: 16px;
            color: var(--mute);
            font-style: italic;
        }

        .content { padding: 50px; }

        /* --- HEADERS --- */
        h2.section-title {
            font-size: 26px;
            font-weight: 400;
            color: var(--ink);
            margin-top: 0;
            margin-bottom: 25px;
            line-height: 1.2;
        }
        .intro-text {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
            color: var(--ink);
        }

        /* --- GLANCE --- */
        .glance-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 25px;
            margin-bottom: 35px;
            border-bottom: 1px solid var(--rule);
            padding-bottom: 25px;
        }
        .glance-item h3 {
            font-size: 28px;
            font-weight: 300;
            margin: 0;
            color: var(--sig);
        }
        .glance-item p {
            font-family: 'Poppins', sans-serif;
            font-size: 11px;
            text-transform: uppercase;
            color: var(--slate);
            margin: 5px 0 0 0;
            letter-spacing: 1px;
        }

        /* --- FINDING CARD --- */
        .finding-card {
            background: white;
            border: 1px solid var(--rule);
            border-left: 4px solid var(--sig);
            margin-bottom: 30px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        .badge {
            display: inline-block;
            background: var(--sigbg);
            color: var(--sig);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 4px 10px;
            border-radius: 3px;
            margin-bottom: 12px;
        }
        .badge.verify {
            background: #FEF3C7;
            color: var(--amb);
        }
        .finding-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 25px;
            align-items: start;
        }
        @media (max-width: 720px) {
            .finding-grid { grid-template-columns: 1fr; }
        }
        .finding-photo img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border: 1px solid var(--rule);
            background: var(--card);
        }
        .finding-body h3 {
            font-size: 18px;
            margin: 0 0 10px 0;
            color: var(--deep);
        }
        .finding-section-label {
            font-family: 'Poppins', sans-serif;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--slate);
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .finding-body ul, .finding-body ol {
            margin: 0;
            padding-left: 20px;
            font-size: 14px;
            line-height: 1.5;
        }
        .finding-body li { margin-bottom: 4px; }

        /* --- OPTIONS TIERS (GOOD / BETTER / BEST) --- */
        .tiers-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }
        @media (max-width: 760px) {
            .tiers-grid { grid-template-columns: 1fr; }
        }
        .tier-card {
            background: white;
            border: 1px solid var(--rule);
            padding: 25px 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .tier-card.recommended {
            border: 2px solid var(--sig);
            box-shadow: 0 8px 24px rgba(206,78,27,0.12);
        }
        .tier-tag {
            font-family: 'Poppins', sans-serif;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--slate);
            margin-bottom: 8px;
        }
        .tier-card.recommended .tier-tag {
            color: var(--sig);
        }
        .tier-price {
            font-family: 'Poppins', sans-serif;
            font-size: 32px;
            font-weight: 600;
            color: var(--ink);
            margin: 10px 0 5px 0;
        }
        .tier-discount {
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            color: var(--sig);
            text-transform: uppercase;
            margin-bottom: 15px;
        }
        .tier-features {
            list-style: none;
            padding: 0;
            margin: 15px 0 0 0;
            border-top: 1px solid var(--rule);
            padding-top: 15px;
            font-size: 13px;
            line-height: 1.5;
        }
        .tier-features li {
            margin-bottom: 8px;
            position: relative;
            padding-left: 18px;
        }
        .tier-features li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--sig);
        }

        /* --- TABLES --- */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 35px;
        }
        th {
            background: var(--deep);
            color: white;
            text-align: left;
            padding: 12px 16px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 500;
        }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--rule);
            font-size: 13px;
            line-height: 1.4;
            vertical-align: top;
        }
        tr:nth-child(even) td { background: white; }

        /* --- PANELS & FOOTERS --- */
        .solution-panel {
            background: var(--grnbg);
            border-left: 4px solid var(--grn);
            padding: 20px 25px;
            margin: 25px 0 35px 0;
        }
        .solution-panel h4 {
            color: var(--grn);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 8px 0;
        }
        .solution-panel p {
            margin: 0;
            font-size: 14px;
            line-height: 1.6;
        }

        .footer {
            border-top: 1px solid var(--rule);
            padding-top: 15px;
            margin-top: 40px;
            display: flex;
            justify-content: space-between;
            font-family: 'Poppins', sans-serif;
            font-size: 11px;
            color: var(--slate);
            text-transform: uppercase;
            flex-wrap: wrap;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div id="report-container">
        <!-- Rendered dynamically from JSON payload below -->
    </div>

    <!-- The Node.js app replaces this script content with the actual generated JSON -->
    <script id="report-data" type="application/json">
    {
      "meta": {
        "company": "Top Elite Roofing",
        "homeowner": "Dini Wang",
        "addressLine1": "226 Benicia Road",
        "addressLine2": "Diamond Bar, California 91765",
        "date": "28 September 2026",
        "dateLabel": "Inspection date",
        "areaSqFt": 3000,
        "roofDescriptor": "one story",
        "roofNote": "one story, garage attached"
      },
      "verdict": {
        "condition": "end_of_life",
        "headline": "The shingles are worn through to the fiberglass mat.",
        "paragraph": "The mat is showing on both slopes photographed (Findings 1 and 2), the hip caps are splitting apart, and the valley has been sealed with cement. No leaks have been reported, but rotted wood has already been found under a shingle at the eave (Finding 5). This is a replacement roof."
      },
      "findings": [
        {
          "severity": "DEFINING",
          "photoId": "60039",
          "photoSrc": "[https://images.unsplash.com/photo-1632759145351-1d592919f522?auto=format&fit=crop&w=600&q=80](https://images.unsplash.com/photo-1632759145351-1d592919f522?auto=format&fit=crop&w=600&q=80)",
          "title": "Worn to the mat on both slopes, the valley sealed in cement",
          "problem": ["On both slopes the white fiberglass mat shows through the shingles course after course.", "The valley where the slopes meet has been filled with a long band of roof cement.", "At lower right the hip caps are broken apart, with loose pieces lying on the roof."],
          "solution": ["Tear off the roof down to the deck.", "Inspect the deck; replace rotted or damaged wood.", "Install new underlayment, valley lining, drip edge, flashings, shingles, and hip and ridge caps."]
        },
        {
          "severity": "HIGH",
          "photoId": "59993",
          "photoSrc": "[https://images.unsplash.com/photo-1590381105924-c72589b9ef3f?auto=format&fit=crop&w=600&q=80](https://images.unsplash.com/photo-1590381105924-c72589b9ef3f?auto=format&fit=crop&w=600&q=80)",
          "title": "Rotted wood under the eave shingle",
          "problem": ["With the shingle lifted, the wood beneath is dark and split.", "The wood is breaking up into loose fibres; a section has broken away.", "The metal edge below it is stained."],
          "solution": ["Replace the rotted decking at the eave.", "Install new drip edge along the eave.", "Probe along the eave to find how far the rot runs."]
        }
      ],
      "options": [
        { "shingle": "Owens Corning Duration", "listPrice": 24180, "laborYears": 10, "mfrShort": "Lifetime", "mfrWarranty": "Owens Corning limited lifetime manufacturer warranty" },
        { "shingle": "GAF Timberline HDZ", "listPrice": 25340, "laborYears": 15, "mfrShort": "50 yrs", "mfrWarranty": "GAF 50-year manufacturer warranty" },
        { "shingle": "CertainTeed Presidential Shake", "listPrice": 35060, "laborYears": 25, "mfrShort": "Lifetime", "mfrWarranty": "CertainTeed limited lifetime manufacturer warranty" }
      ],
      "discount": { "pct": 5, "name": "medical professional" },
      "terms": { "deposit": 1000, "validityDays": 30, "timelineDays": 7, "woodPct": 20 }
    }
    </script>

    <script>
        (function() {
            const rawData = document.getElementById('report-data').textContent;
            let data = {};
            try {
                data = JSON.parse(rawData);
            } catch(e) {
                console.error("Invalid report JSON:", e);
                return;
            }

            const formatCurrency = (num) => '$' + Math.round(num).toLocaleString('en-US');
            const formatDecimals = (num) => '$' + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

            const discountPct = data.discount?.pct || 0;
            const discountFactor = (100 - discountPct) / 100;
            const tierNames = ['Good', 'Better', 'Best'];

            const processedOptions = (data.options || []).map((opt, i) => {
                const list = opt.listPrice || 0;
                const net = list * discountFactor;
                const discountAmt = list - net;
                const balance = net - (data.terms?.deposit || 1000);
                return {
                    tier: tierNames[i] || `Option ${i+1}`,
                    ...opt,
                    netPrice: net,
                    discountAmt: discountAmt,
                    balance: balance,
                    demoPay: balance * 0.40,
                    matPay: balance * 0.30,
                    instPay: balance * 0.25,
                    finalPay: balance * 0.05
                };
            });

            const html = `
                <!-- PAGE 1: COVER -->
                <div class="page cover">
                    <div class="cover-meta">
                        <div>PREPARED FOR <strong>${data.meta.homeowner || 'Homeowner'}</strong></div>
                        <div>${data.meta.dateLabel || 'INSPECTION DATE'} <strong>${data.meta.date || ''}</strong></div>
                        <div>ROOF AREA <strong>${data.meta.areaSqFt ? data.meta.areaSqFt.toLocaleString() + ' sq ft' : ''}</strong></div>
                        <div>PREPARED BY <strong>${data.meta.company || ''}</strong></div>
                    </div>
                    <h1>Roof Condition Report</h1>
                    <div class="address">${data.meta.addressLine1 || ''}${data.meta.addressLine2 ? ', ' + data.meta.addressLine2 : ''}</div>
                    <div class="subtitle">Every problem found on the roof, photographed, with the work that fixes it.</div>
                </div>

                <!-- PAGE 2: AT A GLANCE & VERDICT -->
                <div class="page content">
                    <h2 class="section-title">At a glance</h2>
                    <div class="glance-grid">
                        <div class="glance-item">
                            <h3>${data.findings?.length || 0}</h3>
                            <p>Roof Photographs</p>
                        </div>
                        <div class="glance-item">
                            <h3>${data.meta.areaSqFt ? data.meta.areaSqFt.toLocaleString() : '—'}</h3>
                            <p>Sq Ft Area</p>
                        </div>
                        <div class="glance-item">
                            <h3 style="text-transform: capitalize;">${(data.verdict?.condition || 'end_of_life').replace(/_/g, ' ')}</h3>
                            <p>Field Condition</p>
                        </div>
                    </div>

                    <div class="intro-text">
                        <strong style="color: var(--sig);">THE ONE THING TO KNOW:</strong><br>
                        ${data.verdict?.headline ? `<strong>${data.verdict.headline}</strong> ` : ''}
                        ${data.verdict?.paragraph || ''}
                    </div>

                    <h2 class="section-title" style="margin-top: 40px;">Inspection Findings</h2>
                    ${(data.findings || []).map((f, idx) => `
                        <div class="finding-card">
                            <span class="badge ${f.severity === 'VERIFY' ? 'verify' : ''}">
                                Finding ${idx + 1} ·${f.severity}
                            </span>
                            <div class="finding-grid">
                                <div class="finding-photo">
                                    <img src="${f.photoSrc \vert{}\vert{} ''}" alt="Finding ${idx + 1}" onerror="this.style.display='none'">
                                </div>
                                <div class="finding-body">
                                    <h3>${f.title}</h3>
                                    
                                    <div class="finding-section-label">The Problem</div>
                                    ${Array.isArray(f.problem) 
                                        ? `<ul>${f.problem.map(p => `<li>${p}</li>`).join('')}</ul>`
                                        : `<p style="font-size:14px; margin:0;">${f.problem}</p>`}
                                    
                                    <div class="finding-section-label">The Solution</div>
                                    <ol>${(f.solution || []).map(s => `<li>${s}</li>`).join('')}</ol>
                                </div>
                            </div>
                        </div>
                    `).join('')}

                    <div class="footer">
                        <div>${data.meta.company || ''}</div>
                        <div>Inspection Summary</div>
                    </div>
                </div>

                <!-- PAGE 3: OPTIONS & SCOPE -->
                <div class="page content">
                    <h2 class="section-title">Your Three Options</h2>
                    <p class="intro-text">Every option has the same complete scope of work. They differ only in the shingle specifications and the length of the labor and material warranty.</p>

                    <div class="tiers-grid">
                        ${processedOptions.map((opt, i) => `
                            <div class="tier-card ${i === 1 ? 'recommended' : ''}">
                                <div>
                                    <div class="tier-tag">${i === 1 ? 'RECOMMENDED · ' : ''}${opt.tier}</div>
                                    <div class="tier-price">${formatCurrency(opt.netPrice)}</div>${discountPct > 0 ? `<div class="tier-discount">${formatCurrency(opt.listPrice)} -${discountPct}% ${data.discount.name}</div>` : ''}
                                </div>
                                <ul class="tier-features">
                                    <li><strong>${opt.shingle}</strong></li>
                                    <li>${opt.laborYears}-year labor & material warranty</li>
                                    <li>${opt.mfrWarranty}</li>
                                    <li>Complete deck tear-off & prep</li>
                                    <li>Deck repair included (up to ${data.terms?.woodPct || 20}%)</li>
                                </ul>
                            </div>
                        `).join('')}
                    </div>

                    <div class="solution-panel">
                        <h4>Every Option Includes</h4>
                        <p>Tear-off of all existing layers to deck • Damaged deck wood replaced as needed up to ${data.terms?.woodPct || 20}% • Synthetic underlayment • New drip edge at eaves/rakes • New valley lining • New flashings & pipe boots • Job completed in up to ${data.terms?.timelineDays || 7} days • Full site cleanup & magnetic sweep.</p>
                    </div>

                    <!-- PAYMENT TERMS TABLE -->
                    <h2 class="section-title" style="margin-top: 40px;">Payment Terms</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>Stage</th>
                                <th>Share</th>
                                ${processedOptions.map(o => `<th>${o.tier}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>At signing (deposit)</td>
                                <td>Fixed</td>
                                ${processedOptions.map(() => `<td>${formatCurrency(data.terms?.deposit || 1000)}</td>`).join('')}
                            </tr>
                            <tr>
                                <td>Start of demolition</td>
                                <td>40% of balance</td>
                                ${processedOptions.map(o => `<td>${formatDecimals(o.demoPay)}</td>`).join('')}
                            </tr>
                            <tr>
                                <td>Material delivery</td>
                                <td>30% of balance</td>
                                ${processedOptions.map(o => `<td>${formatDecimals(o.matPay)}</td>`).join('')}
                            </tr>
                            <tr>
                                <td>Materials installed</td>
                                <td>25% of balance</td>
                                ${processedOptions.map(o => `<td>${formatDecimals(o.instPay)}</td>`).join('')}
                            </tr>
                            <tr>
                                <td>Final inspection</td>
                                <td>5% of balance</td>
                                ${processedOptions.map(o => `<td>${formatDecimals(o.finalPay)}</td>`).join('')}
                            </tr>
                            <tr style="font-weight: bold; background: var(--card);">
                                <td>Total Investment</td>
                                <td>100%</td>
                                ${processedOptions.map(o => `<td>${formatCurrency(o.netPrice)}</td>`).join('')}
                            </tr>
                        </tbody>
                    </table>

                    <div class="solution-panel" style="background: var(--card); border-left-color: var(--slate); margin-top: 40px;">
                        <h4 style="color: var(--ink);">NO PRESSURE</h4>
                        <p style="color: var(--slate);">You do not need to decide today. This report is yours to keep. Take it, show it to anyone, and put these questions to every contractor you speak with. These prices are guaranteed for ${data.terms?.validityDays || 30} days from the inspection date.</p>
                    </div>

                    <div class="footer">
                        <div>${data.meta.company || ''}</div>
                        <div>Page 3 · Terms & Acceptance</div>
                    </div>
                </div>
            `;

            document.getElementById('report-container').innerHTML = html;
        })();
    </script>
</body>
</html>
